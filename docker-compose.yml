services:
  web:
    build: ./docker/php
    ports:
      - "${WEB_PORT:-8088}:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_DEBUG: "1"
      ADMIN_SIGNUP_CODE: "${ADMIN_SIGNUP_CODE:-fuselab-dev}"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: fuselab
      DB_USER: fuselab
      DB_PASS: fuselab
    depends_on:
      - db

  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: fuselab
      MARIADB_USER: fuselab
      MARIADB_PASSWORD: fuselab
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT_HOST:-3310}:3306"
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "${PMA_PORT:-8089}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db-data:
